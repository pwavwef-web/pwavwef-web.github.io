# AZ Studio checks: lint, types, unit tests and builds on every push and pull request.
# scripts/deploy.mjs reads this workflow's result for the commit it deploys and refuses a red or unfinished run.
name: check

on:
  push:
    branches-ignore: [maintenance]
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # The renderer tests render real video with FFmpeg + libass and need fonts for text metrics.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-core fonts-dejavu-core
      - run: npm ci
      - run: npm run check
