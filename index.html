<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1120">
  <meta name="robots" content="noindex, follow">
  <meta name="description" content="AZ Learner is undergoing maintenance. We'll be back soon.">
  <title>Under Maintenance | AZ Learner</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(ellipse at top, #183354 0%, transparent 65%),
        #0b1120;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      text-align: center;
    }

    main {
      width: 100%;
      max-width: 620px;
      padding: clamp(32px, 7vw, 64px) clamp(24px, 5vw, 48px);
      border: 1px solid #334155;
      border-radius: 24px;
      background: #111c2ee6;
      box-shadow: 0 24px 80px #00000040;
    }

    .brand {
      margin: 0 0 40px;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .brand span { color: #7dd3fc; }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 8px 14px;
      border: 1px solid #475569;
      border-radius: 999px;
      color: #fde68a;
      font-size: 13px;
      font-weight: 600;
    }

    .status::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #fbbf24;
    }

    h1 {
      margin: 24px 0 18px;
      font-size: clamp(34px, 7vw, 52px);
      line-height: 1.1;
      letter-spacing: -0.04em;
    }

    .message {
      margin: 0 auto;
      max-width: 420px;
      color: #cbd5e1;
      font-size: 17px;
      line-height: 1.75;
    }

    .thanks {
      margin: 30px 0 0;
      color: #94a3b8;
      font-size: 14px;
    }

    footer {
      margin-top: 40px;
      padding-top: 24px;
      border-top: 1px solid #334155;
      color: #94a3b8;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <main aria-labelledby="maintenance-title">
    <p class="brand"><span>AZ</span> LEARNER</p>

    <div class="status">Maintenance in progress</div>

    <h1 id="maintenance-title">A little pause.<br>A better experience.</h1>

    <p class="message">
      AZ Learner is temporarily unavailable while we make improvements.
      We're working to bring the site back soon.
      Please check back later.
    </p>

    <p class="thanks">Thank you for your patience. Keep learning, keep growing.</p>

    <footer>AZ Learner &middot; azlearner.me</footer>
  </main>
</body>
</html>
